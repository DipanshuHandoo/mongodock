name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Release requires a green CI run on the exact main commit, so main runs are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A push to main that only changes release metadata (e.g. a merged "Version Packages" PR)
      # ships the same code as the previous main commit. When that commit already has a green
      # CI run, the test matrix is skipped. Anything else runs full CI.
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          full=true
          if [ "$EVENT_NAME" = "push" ] && node scripts/ci-scope.mjs "$BEFORE" "$SHA"; then
            passed=$(gh run list --workflow ci.yml --commit "$BEFORE" --status success --json databaseId --jq length || echo 0)
            if [ "$passed" != "0" ]; then
              full=false
              echo "::notice::Release-metadata-only commit; reusing green CI from ${BEFORE}"
            else
              echo "Previous commit ${BEFORE} has no green CI run; running full CI"
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node-version }}, mongoose ${{ matrix.mongoose }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
        mongoose: [8.24.5, 9.11.2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Select tested Mongoose peer without changing the lockfile
        run: npm install --no-save --ignore-scripts mongoose@${{ matrix.mongoose }}
      - name: Install Chromium (browser-enabled packages only)
        if: hashFiles('scripts/check-browser.mjs') != ''
        run: npx playwright install --with-deps chromium
      - run: npm run verify

  integration-mongo-7:
    name: integration (mongodb 7.0, mongoose ${{ matrix.mongoose }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mongoose: [8.24.5, 9.11.2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select tested Mongoose peer without changing the lockfile
        run: npm install --no-save --ignore-scripts mongoose@${{ matrix.mongoose }}
      - run: npm run test:integration
        env:
          MONGODOCK_TEST_MONGO_VERSION: "7.0"

  scale:
    name: scale (ubuntu, node 24)
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:scale

  changeset:
    name: changeset present
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a changeset when shipped files change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if echo "$changed" | grep -Eq '^(src/|docs/|README\.md$)'; then
            if ! echo "$changed" | grep -Eq '^\.changeset/.+\.md$' ; then
              echo "::error::Shipped files changed (src/, docs/ or README.md) but no changeset was added. Run 'npm run changeset' (use 'npm run changeset -- --empty' for changes that need no release)."
              exit 1
            fi
          fi

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm audit --audit-level=high
